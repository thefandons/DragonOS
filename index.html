<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link type="text/css" rel="stylesheet" href="./ CSS_code/style.css">
        <title>DragonOS</title>
    </head>
    <body>
        <div class="content">
            <h1>Welcome to my very own OS, DragonOS!</h1>
            <h2>This is designed around the famous anime, Dragon Ball.</h2>
            <p>Goku solos fiction, argue with a brick wall</p>
        </div>
        <div class="topbar">
            <img id="dragonball" src="./resources/4-star Dragon Ball.png">
            <p id="time">Monday, August 24, 2026 11:35 pm</p>
        </div>
        <script>
            var currentTime = new Date().toLocaleString();
            var timeText = document.querySelector("#time");
            timeText.innerHTML = currentTime
            function updateTime() {
                var currentTime = new Date().toLocaleString();
                var timeText = document.querySelector("#time");
                timeText.innerHTML = currentTime;
            }
            setInterval(updateTime, 1000);
        </script>
    </body>
</html>
